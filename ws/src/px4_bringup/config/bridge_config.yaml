# Template: minimal.launch.py substitutes ${world} and ${model} before starting the bridge.

- gz_topic_name: "/world/${world}/model/${model}_0/link/camera_link/sensor/imager/image"
  ros_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: false

- gz_topic_name: "/world/${world}/model/${model}_0/link/camera_link/sensor/imager/camera_info"
  ros_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: false
